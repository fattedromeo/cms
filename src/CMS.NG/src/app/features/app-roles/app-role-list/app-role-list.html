<div class="page">
  <p-toast />
  <p-confirmDialog />

  <div class="card page-header">
    <div class="page-header__titles">
      <h1 class="page-header__title">角色 AppRole</h1>
      <span class="page-header__subtitle">使用者角色</span>
    </div>
    <div class="page-header__actions">
      <p-button
        label="搜尋條件"
        icon="pi pi-filter"
        severity="secondary"
        [outlined]="true"
        (onClick)="openFilter()"
      />
      <p-button label="新增" icon="pi pi-plus" severity="success" (onClick)="add()" />
    </div>
  </div>

  <div class="card">
    <p-table
      [value]="roles()"
      [loading]="loading()"
      dataKey="roleId"
      [paginator]="true"
      [rows]="rows"
      [first]="first"
      [rowsPerPageOptions]="[10, 20, 50]"
      [showCurrentPageReport]="true"
      currentPageReportTemplate="{first}–{last} 筆，共 {totalRecords} 筆"
      [sortField]="sortField"
      [sortOrder]="sortOrder"
      (onSort)="onSort($event)"
      (onPage)="onPage($event)"
      styleClass="p-datatable-sm p-datatable-gridlines"
    >
      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="pkid" style="width: 6rem">主代碼 <p-sortIcon field="pkid" /></th>
          <th pSortableColumn="roleId">角色代碼 <p-sortIcon field="roleId" /></th>
          <th pSortableColumn="roleName">角色名稱 <p-sortIcon field="roleName" /></th>
          <th pSortableColumn="permissionLevel" style="width: 9rem">
            權限等級 <p-sortIcon field="permissionLevel" />
          </th>
          <th pSortableColumn="description">描述 <p-sortIcon field="description" /></th>
          <th pSortableColumn="userCount" style="width: 8rem">
            使用者數 <p-sortIcon field="userCount" />
          </th>
          <th style="width: 9rem" class="col-actions">操作</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-role>
        <tr>
          <td>{{ role.pkid }}</td>
          <td>{{ role.roleId }}</td>
          <td>{{ role.roleName }}</td>
          <td>{{ role.permissionLevel }}</td>
          <td>{{ role.description }}</td>
          <td>{{ role.userCount }}</td>
          <td class="col-actions">
            <button
              type="button"
              class="icon-btn icon-btn--view"
              (click)="view(role)"
              pTooltip="檢視"
              tooltipPosition="top"
              aria-label="檢視"
            >
              <i class="pi pi-eye"></i>
            </button>
            <button
              type="button"
              class="icon-btn icon-btn--edit"
              (click)="edit(role)"
              pTooltip="編輯"
              tooltipPosition="top"
              aria-label="編輯"
            >
              <i class="pi pi-pencil"></i>
            </button>
            <button
              type="button"
              class="icon-btn icon-btn--delete"
              (click)="remove(role)"
              pTooltip="刪除"
              tooltipPosition="top"
              aria-label="刪除"
            >
              <i class="pi pi-trash"></i>
            </button>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="7" class="empty-row">查無資料</td>
        </tr>
      </ng-template>
    </p-table>
  </div>

  <!-- Filter drawer -->
  <p-drawer
    [visible]="filterVisible()"
    (visibleChange)="filterVisible.set($event)"
    header="搜尋條件"
    position="right"
    styleClass="filter-drawer"
  >
    <div class="drawer-body">
      <div class="field">
        <label for="f-keyword">關鍵字</label>
        <input
          id="f-keyword"
          type="text"
          pInputText
          [(ngModel)]="filterDraft.keyword"
          placeholder="角色代碼 / 名稱 / 描述"
        />
      </div>

      <div class="field">
        <label for="f-level">權限等級</label>
        <p-inputNumber
          inputId="f-level"
          [(ngModel)]="filterDraft.permissionLevel"
          [useGrouping]="false"
          placeholder="不限"
        />
      </div>
    </div>

    <ng-template pTemplate="footer">
      <div class="drawer-footer">
        <p-button label="清除" severity="secondary" [text]="true" (onClick)="clearFilters()" />
        <p-button label="套用" icon="pi pi-check" (onClick)="applyFilters()" />
      </div>
    </ng-template>
  </p-drawer>
</div>
