<div class="page">
  <p-toast />

  <form [formGroup]="form" (ngSubmit)="save()">
    <div class="card page-header">
      <div class="page-header__titles">
        <h1 class="page-header__title">{{ isEdit() ? '編輯課程群組' : '新增課程群組' }}</h1>
      </div>
      <div class="page-header__actions">
        <p-button
          label="取消"
          icon="pi pi-times"
          severity="secondary"
          [outlined]="true"
          type="button"
          (onClick)="cancel()"
        />
        <p-button
          label="儲存"
          icon="pi pi-check"
          severity="success"
          type="submit"
          [loading]="saving()"
        />
      </div>
    </div>

    @if (loading()) {
      <div class="card status-card">載入中…</div>
    } @else {
      <div class="card">
        <h2 class="section-title">課程群組資料</h2>
        <div class="form-grid">
          @if (isEdit()) {
            <div class="field">
              <label for="pkid">主代碼</label>
              <p-inputNumber
                inputId="pkid"
                formControlName="pkid"
                [useGrouping]="false"
                styleClass="w-full"
              />
              <small class="field-hint">主代碼為系統自動產生，不可修改。</small>
            </div>
          }

          <div class="field">
            <label for="description">群組名稱 <span class="required">*</span></label>
            <input
              id="description"
              type="text"
              pInputText
              formControlName="description"
              maxlength="100"
              placeholder="請輸入群組名稱"
              [class.ng-invalid-visual]="invalid('description')"
            />
            @if (invalid('description')) {
              <small class="field-error">群組名稱為必填。</small>
            }
          </div>
        </div>
      </div>
    }
  </form>
</div>
