<div class="page">
  <p-toast />
  <p-confirmDialog />

  <div class="card page-header">
    <div class="page-header__titles">
      <h1 class="page-header__title">發布狀態 PublishStatus</h1>
      <span class="page-header__subtitle">內容發布狀態代碼表</span>
    </div>
    <div class="page-header__actions">
      <p-button
        label="搜尋條件"
        icon="pi pi-filter"
        severity="secondary"
        [outlined]="true"
        (onClick)="openFilter()"
      />
      <p-button label="新增" icon="pi pi-plus" severity="success" (onClick)="add()" />
    </div>
  </div>

  <div class="card">
    <p-table
      [value]="statuses()"
      [loading]="loading()"
      dataKey="pkid"
      [paginator]="true"
      [rows]="rows"
      [first]="first"
      [rowsPerPageOptions]="[10, 20, 50]"
      [showCurrentPageReport]="true"
      currentPageReportTemplate="{first}–{last} 筆，共 {totalRecords} 筆"
      [sortField]="sortField"
      [sortOrder]="sortOrder"
      (onSort)="onSort($event)"
      (onPage)="onPage($event)"
      styleClass="p-datatable-sm p-datatable-gridlines"
    >
      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="pkid" style="width: 6rem">主代碼 <p-sortIcon field="pkid" /></th>
          <th pSortableColumn="description">狀態說明 <p-sortIcon field="description" /></th>
          <th pSortableColumn="isDraft" style="width: 8rem">草稿 <p-sortIcon field="isDraft" /></th>
          <th pSortableColumn="isPublished" style="width: 8rem">
            已發布 <p-sortIcon field="isPublished" />
          </th>
          <th pSortableColumn="isDiscontinued" style="width: 8rem">
            已停用 <p-sortIcon field="isDiscontinued" />
          </th>
          <th style="width: 9rem" class="col-actions">操作</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-status>
        <tr>
          <td>{{ status.pkid }}</td>
          <td>{{ status.description }}</td>
          <td>
            <p-tag
              [value]="status.isDraft ? '是' : '否'"
              [severity]="status.isDraft ? 'success' : 'secondary'"
            />
          </td>
          <td>
            <p-tag
              [value]="status.isPublished ? '是' : '否'"
              [severity]="status.isPublished ? 'success' : 'secondary'"
            />
          </td>
          <td>
            <p-tag
              [value]="status.isDiscontinued ? '是' : '否'"
              [severity]="status.isDiscontinued ? 'success' : 'secondary'"
            />
          </td>
          <td class="col-actions">
            <button
              type="button"
              class="icon-btn icon-btn--view"
              (click)="view(status)"
              pTooltip="檢視"
              tooltipPosition="top"
              aria-label="檢視"
            >
              <i class="pi pi-eye"></i>
            </button>
            <button
              type="button"
              class="icon-btn icon-btn--edit"
              (click)="edit(status)"
              pTooltip="編輯"
              tooltipPosition="top"
              aria-label="編輯"
            >
              <i class="pi pi-pencil"></i>
            </button>
            <button
              type="button"
              class="icon-btn icon-btn--delete"
              (click)="remove(status)"
              pTooltip="刪除"
              tooltipPosition="top"
              aria-label="刪除"
            >
              <i class="pi pi-trash"></i>
            </button>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="6" class="empty-row">查無資料</td>
        </tr>
      </ng-template>
    </p-table>
  </div>

  <!-- Filter drawer -->
  <p-drawer
    [visible]="filterVisible()"
    (visibleChange)="filterVisible.set($event)"
    header="搜尋條件"
    position="right"
    styleClass="filter-drawer"
  >
    <div class="drawer-body">
      <div class="field">
        <label for="f-keyword">關鍵字</label>
        <input
          id="f-keyword"
          type="text"
          pInputText
          [(ngModel)]="filterDraft.keyword"
          placeholder="狀態說明"
        />
      </div>

      <div class="field">
        <label for="f-draft">草稿</label>
        <p-select
          inputId="f-draft"
          [options]="boolOptions"
          [(ngModel)]="filterDraft.isDraft"
          optionLabel="label"
          optionValue="value"
          appendTo="body"
        />
      </div>

      <div class="field">
        <label for="f-published">已發布</label>
        <p-select
          inputId="f-published"
          [options]="boolOptions"
          [(ngModel)]="filterDraft.isPublished"
          optionLabel="label"
          optionValue="value"
          appendTo="body"
        />
      </div>

      <div class="field">
        <label for="f-discontinued">已停用</label>
        <p-select
          inputId="f-discontinued"
          [options]="boolOptions"
          [(ngModel)]="filterDraft.isDiscontinued"
          optionLabel="label"
          optionValue="value"
          appendTo="body"
        />
      </div>
    </div>

    <ng-template pTemplate="footer">
      <div class="drawer-footer">
        <p-button label="清除" severity="secondary" [text]="true" (onClick)="clearFilters()" />
        <p-button label="套用" icon="pi pi-check" (onClick)="applyFilters()" />
      </div>
    </ng-template>
  </p-drawer>
</div>
